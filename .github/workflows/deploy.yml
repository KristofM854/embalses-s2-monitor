name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "data/**", ".github/workflows/deploy.yml"]
    # the images branch is published by the update workflow, which calls this one
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # when called after an update, include the commit it just pushed
      - name: Get images (branch "images")
        run: |
          mkdir -p _site/images
          if git ls-remote --exit-code --heads origin images > /dev/null; then
            git fetch --depth 1 origin images
            git archive FETCH_HEAD | tar -x -C _site/images
          fi
      - name: Assemble site
        run: |
          cp -r dashboard/. _site/
          cp -r data _site/data
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v5
