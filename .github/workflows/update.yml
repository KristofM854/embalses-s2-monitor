name: Update data

on:
  schedule:
    # Every two hours. Sentinel-2 passes at ~15:15 UTC and the processed scene reaches
    # Earth Engine some hours to a day later; frequent checks show it as soon as it is there.
    # A run that finds nothing new writes nothing, commits nothing and does not redeploy.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Re-query everything since 2017 (first run, or after changing config.py)"
        type: boolean
        default: false
      max_images:
        description: "Max image pairs to render in this run (newest first)"
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed == 'true' || steps.images.outputs.changed == 'true' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Get current images (branch "images", latest version only)
        run: |
          # Images live on their own branch that always holds a single commit, so they
          # never pile up in the history of main. See README, "images branch".
          if git ls-remote --exit-code --heads origin images > /dev/null; then
            git fetch --depth 1 origin images
            git worktree add --detach images FETCH_HEAD
          else
            git worktree add --orphan -b images images
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Sentinel-2 statistics and images
        # Step timeout below the job timeout: a slow step then fails instead of the
        # whole job being cancelled, so the commit step below still saves the data.
        timeout-minutes: 300
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: |
          if [ -z "$EE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Secret EE_SERVICE_ACCOUNT_KEY is missing. See docs/SETUP.md"; exit 1
          fi
          python -m pipeline.update \
            ${{ inputs.full_rebuild && '--full' || '' }} \
            --max-images ${{ inputs.max_images || '300' }}
      - name: Commit new data
        id: commit
        if: ${{ !cancelled() }}   # keep partial progress even if the step above failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish images
        id: images
        if: ${{ !cancelled() }}
        working-directory: images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git rev-parse --verify -q HEAD > /dev/null; then
            if git diff --cached --quiet; then echo "No image changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            # Replace the single commit instead of adding one: only new images are uploaded,
            # and removed images do not stay in any history.
            git commit -q --amend -m "Images $(date -u +%Y-%m-%d)"
          else
            git commit -q -m "Images $(date -u +%Y-%m-%d)"
          fi
          git push -f origin HEAD:refs/heads/images
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
