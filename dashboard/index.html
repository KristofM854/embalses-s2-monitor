<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embalses: clorofila por satélite</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/plotly-basic.min.js"></script>
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="title"></h1>
    <p class="sub"><span data-i18n="updated"></span> <span id="updated">–</span> · <span data-i18n="source_short"></span></p>
  </div>
  <div class="top-actions">
    <a class="btn" href="#descargas" data-i18n="nav_download"></a>
    <a class="btn" href="#como-funciona" data-i18n="nav_how"></a>
    <button class="btn" id="lang" type="button"></button>
  </div>
</header>

<main>
  <p class="lead" data-i18n-html="lead"></p>

  <!-- 1. Now -->
  <section>
    <h2 data-i18n="h_now"></h2>
    <p class="note" data-i18n="now_help"></p>
    <div id="cards" class="cards" aria-live="polite"></div>
  </section>

  <!-- Image viewer (opens from cards, charts, table) -->
  <section id="viewer" class="viewer" hidden>
    <div class="viewer-head">
      <h2 id="v-title"></h2>
      <div>
        <button type="button" class="btn" id="v-prev" data-i18n="prev"></button>
        <button type="button" class="btn" id="v-next" data-i18n="next"></button>
        <button type="button" class="btn" id="v-close" data-i18n="close"></button>
      </div>
    </div>
    <p id="v-summary" class="v-summary"></p>
    <ul id="v-notes" class="notes"></ul>
    <div class="pair">
      <figure><img id="v-rgb" alt=""><figcaption data-i18n="cap_rgb"></figcaption></figure>
      <figure><img id="v-ndci" alt=""><figcaption data-i18n="cap_ndci"></figcaption></figure>
    </div>
    <p id="v-noimg" class="note" hidden data-i18n="noimg"></p>
    <div class="legend">
      <div class="bar"></div>
      <div class="legend-labels"><span data-i18n="leg_low"></span><span data-i18n="leg_mid"></span><span data-i18n="leg_high"></span></div>
      <p class="note" data-i18n="leg_note"></p>
      <details class="small">
        <summary data-i18n="leg_numbers"></summary>
        <div class="ticks" id="ticks"></div>
        <p class="note" data-i18n="leg_numbers_note"></p>
      </details>
    </div>
    <details class="small">
      <summary data-i18n="tech_values"></summary>
      <p id="v-stats" class="stats"></p>
    </details>
  </section>

  <!-- 2. Season -->
  <section>
    <h2 data-i18n="h_season"></h2>
    <p class="note" data-i18n="season_help"></p>
    <div id="season" class="season"></div>
  </section>

  <!-- 3. History -->
  <section>
    <h2 data-i18n="h_history"></h2>
    <p class="note" data-i18n="history_help"></p>
    <div class="filters" aria-label="filters">
      <label><span data-i18n="f_res"></span>
        <select id="f-res"><option value="all" data-i18n="both"></option></select></label>
      <div class="quick" role="group">
        <button type="button" data-range="90" data-i18n="r_3m"></button>
        <button type="button" data-range="365" data-i18n="r_1y"></button>
        <button type="button" data-range="all" data-i18n="r_all"></button>
      </div>
      <label class="check"><input type="checkbox" id="f-high"> <span data-i18n="f_high"></span></label>
      <label class="check"><input type="checkbox" id="f-img"> <span data-i18n="f_img"></span></label>
      <details class="advanced">
        <summary data-i18n="advanced"></summary>
        <div class="adv-row">
          <label><span data-i18n="f_from"></span><input type="date" id="f-from"></label>
          <label><span data-i18n="f_to"></span><input type="date" id="f-to"></label>
          <label><span data-i18n="f_clear"></span> <b id="v-clear"></b>
            <input type="range" id="f-clear" min="0" max="100" step="5" value="50"></label>
        </div>
      </details>
    </div>
    <div id="charts"></div>
    <details class="small">
      <summary data-i18n="h_b4"></summary>
      <p class="note" data-i18n="b4_help"></p>
      <div id="charts-b4"></div>
    </details>
  </section>

  <!-- 4. Table -->
  <section>
    <div class="table-head">
      <h2><span data-i18n="h_table"></span> (<span id="n-rows">0</span>)</h2>
    </div>
    <p class="note" data-i18n="table_help"></p>
    <div class="table-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>

  <!-- 5. Downloads -->
  <section id="descargas">
    <h2 data-i18n="h_download"></h2>
    <ul class="downloads">
      <li><a class="btn" href="data/reservoir_ndci.xlsx" download data-i18n="dl_xlsx"></a> <span data-i18n="dl_xlsx_help"></span></li>
      <li><a class="btn" href="data/reservoir_ndci.csv" download data-i18n="dl_csv"></a> <span data-i18n="dl_csv_help"></span></li>
      <li><button type="button" class="btn" id="dl-filtered" data-i18n="dl_filtered"></button> <span data-i18n="dl_filtered_help"></span></li>
      <li><a class="btn" href="data/aoi_Hatillo.geojson" download>Hatillo.geojson</a>
          <a class="btn" href="data/aoi_Valdesia.geojson" download>Valdesia.geojson</a>
          <span data-i18n="dl_aoi_help"></span></li>
    </ul>
  </section>

  <!-- 6. How it works -->
  <section id="como-funciona" class="explain">
    <h2 data-i18n="h_how"></h2>
    <div id="explain"></div>
  </section>

  <footer class="note" data-i18n-html="footer"></footer>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
